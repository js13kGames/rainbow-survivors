<script>
(() => {
  "use strict";

  addEventListener("resize", resize);
  resize();

  }

  let currentStroke = null;

        x: lerp(a.x, target.x, i / n),
        y: lerp(a.y, target.y, i / n)

  function blastOrange(t) {
    if (t.exploded) return;

  const INDIGO_BLOCK = 60;

      const p = confetti[i];
      p.t += dt;
      if (p.t > p.d || p.y > H + 30) {
        confetti.splice(i, 1);
        continue;
      }
      p.vy += 90 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
  }
  function drawConfetti() {
    const exitFade = menuCloseAt >= 0 ? 1 - clamp((performance.now() - menuCloseAt) / MENU_OUT, 0, 1) : 1;
    confetti.forEach(p => {
      const a = clamp((H - p.y) / 70, 0, 1) * exitFade;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
  }
  function drawUI() {
    ctx.textAlign = "left";
    ctx.font = "13px system-ui";

      const a = flashT / FLASH_D;
      ctx.fillStyle = `rgba(255,52,72,${(.3 * a * a).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }
    const upgrading = paused && levelChoices.length > 0;
    const xpT = upgrading ? 1 : clamp(player.xp / player.xpNext, 0, 1);
    const levelFxElapsed = (performance.now() - levelFxStart) / 1e3;
    const levelPhase = upgrading ? performance.now() / 1e3 * 150 % 360 : levelFxElapsed >= 0 && levelFxElapsed < 1.15 ? levelFxElapsed * 420 : 0;
    ctx.fillStyle = "rgba(18,20,28,.94)";
    ctx.fillRect(0, 0, W, 16);
    if (xpT > 0) {

    ctx.fillRect(0, 15, W, 1);
    ctx.textAlign = "center";
    ctx.font = "700 12px system-ui";
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillText(`LV ${player.level}`, W * .5, 12.5);
    ctx.fillStyle = "#fff";
    ctx.fillText(`LV ${player.level}`, W * .5, 11.5);
    ctx.font = "700 13px system-ui";
    ctx.fillStyle = "rgba(18,20,28,.82)";
    roundRect(W * .5 - 40, 22, 80, 22, 11);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(fmtTime(gameTime), W * .5, 37);
    const lx = 14, ly = H - 70, lw = 230, lh = 60;
    panel(lx, ly, lw, lh);
    const regenning = !dead && !paused && player.hp < player.maxHp && player.noHitTime > REGEN_DELAY;
    drawPlusIcon(lx + 26, ly + 18, 7, regenning ? "#68dc74" : "#ff596d");
    bar(lx + 46, ly + 10, lw - 60, 16, player.hp / player.maxHp, "#ff596d", `${Math.ceil(player.hp)} / ${player.maxHp}`);
    drawWindIcon(lx + 26, ly + 42, 7, "#53e1df");
    bar(lx + 46, ly + 34, lw - 60, 16, player.stamina / player.maxStamina, "#53e1df", `${Math.ceil(player.stamina)} / ${player.maxStamina}`);
    const pw = 320, ph = 100, px = W - pw - 14, py = H - ph - 14;
    panel(px, py, pw, ph);
    bar(px + 16, py + 14, pw - 32, 17, player.paint / player.maxPaint, COLORS[selected].key, `${Math.floor(player.paint)} / ${player.maxPaint}`);
    const gap = 38, cy = py + 66, cx = px + pw / 2 - 3 * gap;
    ctx.fillStyle = COLORS[selected].key;
    ctx.font = "700 11px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(COLORS[selected].role, cx + selected * gap, py + 49);
    for (let i = 0; i < 7; i++) {
      ctx.beginPath();
      ctx.arc(cx + i * gap, cy, selected === i ? 12 : 10, 0, TAU);
      ctx.fillStyle = COLORS[i].key;
      ctx.fill();
      if (selected === i) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,.82)";
      ctx.font = "10px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(String(i + 1), cx + i * gap, cy + 27);
    }
    if (started) drawHint();
    drawBossDefeated();
    if (!started) drawStart();
    if (levelChoices.length) drawUpgradeMenu();
    if (dead) drawDeath();
    drawConfetti();
    drawRestartConfirm();
  }
  const fmtTime = t => `${t / 60 | 0}:${("" + (100 + t % 60 | 0)).slice(1)}`;
  const HINT = [ "WASD - Move", "Space (Hold) - Sprint", "Mouse (Hold) - Draw", "1–7 / Scroll - Change Color", "R - Restart" ];
  function drawHint() {
    ctx.font = "11px system-ui";
    ctx.textAlign = "left";
    HINT.forEach((line, i) => {
      const y = 32 + i * 14;
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fillText(line, 15, y + 1);
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.fillText(line, 14, y);
    });
  }
  function drawPlusIcon(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.fillRect(cx - r, cy - r * .32, r * 2, r * .64);
    ctx.fillRect(cx - r * .32, cy - r, r * .64, r * 2);
  }
  function drawWindIcon(cx, cy, r, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - 4);
    ctx.lineTo(cx + r * .6, cy - 4);
    ctx.moveTo(cx - r, cy);
    ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx - r, cy + 4);
    ctx.lineTo(cx + r * .4, cy + 4);
    ctx.stroke();
  }
  function panel(x, y, w, h) {
    ctx.fillStyle = "rgba(19,22,30,.78)";
    roundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.1)";
    ctx.stroke();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }
  function bar(x, y, w, h, t, color, text, center = false) {
    ctx.fillStyle = "#303646";
    roundRect(x, y, w, h, 7);
    ctx.fill();
    ctx.fillStyle = color;
    roundRect(x, y, w * clamp(t, 0, 1), h, 7);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "12px system-ui";
    ctx.textAlign = center ? "center" : "left";
    ctx.fillText(text, center ? x + w / 2 : x + 7, y + h - 3);
  }
  function drawCardIcon(kind, cx, cy, r, color) {
    if (!kind || kind === 6) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, r * (kind ? .9 : .62), 0, TAU);
      ctx.fill();
    } else if (kind === 1) poly(ngon(r * .8, 3, Math.PI / 2).map(([x, y]) => [ cx + x, cy + y ]), color); else if (kind === 2) drawPlusIcon(cx, cy, r, color); else if (kind === 3) drawWindIcon(cx, cy, r, color); else if (kind === 4) drawRainbowIcon(cx, cy + 5, r * .85, r * .2); else if (kind === 5) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cx, cy, r * .62, 0, TAU);
      ctx.stroke();
    }
  }
  function menuPhase() {
    if (menuCloseAt >= 0) return 1 - clamp((performance.now() - menuCloseAt) / MENU_OUT, 0, 1);
    if (menuOpenAt < 0) return 1;
    return clamp((performance.now() - menuOpenAt) / MENU_IN, 0, 1);
  }
  const easeOut = q => 1 - (1 - q) * (1 - q) * (1 - q);
  function drawUpgradeMenu() {
    const raw = menuPhase(), closing = menuCloseAt >= 0, q = easeOut(raw);
    ctx.save();
    ctx.fillStyle = `rgba(12,14,20,${(.72 * q).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    const fx = (performance.now() - levelFxStart) / 1e3;
    const titleY = H * .27 + (1 - q) * (closing ? -16 : 22);
    ctx.save();
    ctx.globalAlpha = q;
    ctx.fillStyle = rainbowGradient(W / 2 - 90, titleY - 28, 180, fx * 420);
    ctx.font = "700 30px system-ui";
    ctx.fillText("LEVEL UP", W / 2, titleY);
    ctx.globalAlpha = q * clamp(raw * 1.6 - .4, 0, 1);
    ctx.font = "14px system-ui";
    ctx.fillStyle = "#cfd4df";
    ctx.fillText("Choose an upgrade — click a card or press 1, 2 or 3", W / 2, titleY + 28);
    ctx.restore();
    const cw = 200, ch = 152, gap = 15, y0 = H * .37;
    levelChoices.forEach((u, i) => {
      const delay = closing ? 0 : i * .06;
      const cq = easeOut(clamp((raw - delay) / Math.max(.001, 1 - delay), 0, 1));
      const chosen = closing && i === menuChosen;
      const alpha = closing ? chosen ? cq : cq * cq : cq;
      if (alpha <= .002) return;
      const scale = chosen ? 1 + (1 - cq) * .14 : 1;
      const dy = (1 - cq) * (closing ? chosen ? -10 : 34 : 26);
      const x = W / 2 - (cw * 3 + gap * 2) / 2 + i * (cw + gap), y = y0 + dy;
      ctx.save();
      ctx.globalAlpha = alpha;
      if (scale !== 1) {
        const mx = x + cw / 2, my = y + ch / 2;
        ctx.translate(mx, my);
        ctx.scale(scale, scale);
        ctx.translate(-mx, -my);
      }
      panel(x, y, cw, ch);
      ctx.strokeStyle = u.rarity.color;
      ctx.lineWidth = 2.5;
      roundRect(x, y, cw, ch, 12);
      ctx.stroke();
      ctx.fillStyle = hexA(u.rarity.color, .1);
      roundRect(x, y, cw, ch, 12);
      ctx.fill();
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.font = "700 12px system-ui";
      ctx.fillText(`${i + 1}`, x + 16, y + 22);
      ctx.fillStyle = u.rarity.color;
      ctx.font = "700 10px system-ui";
      ctx.fillText(u.rarity.name, x + cw / 2, y + 20);
      drawCardIcon(u.def.icon, x + cw / 2, y + 62, 19, u.def.color);
      ctx.fillStyle = "#fff";
      ctx.font = "700 15px system-ui";
      ctx.fillText(u.def.name, x + cw / 2, y + 109);
      ctx.fillStyle = u.def.color;
      ctx.font = "700 22px system-ui";
      ctx.fillText(u.text, x + cw / 2, y + 136);
      ctx.restore();
    });
    ctx.restore();
  }
  const ABOUT = [ "Fight by sprinting into enemies or drawing rainbow trails.", "Each rainbow color has a different effect.", "Survive 8 minutes, defeat the Boss, then keep going." ];
  function drawStart() {
    ctx.fillStyle = "rgba(10,12,18,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = rainbowGradient(W / 2 - 190, H * .2 - 40, 380, performance.now() / 1e3 * 150 % 360);
    ctx.font = "700 40px system-ui";
    ctx.fillText("RAINBOW SURVIVORS", W / 2, H * .2);
    ctx.fillStyle = "#cfd4df";
    ctx.font = "15px system-ui";
    ABOUT.forEach((line, i) => ctx.fillText(line, W / 2, H * .2 + 44 + i * 24));
    ctx.fillStyle = "rgba(255,255,255,.72)";
    ctx.font = "13px system-ui";
    HINT.forEach((line, i) => ctx.fillText(line, W / 2, H * .53 + i * 20));
    ctx.fillStyle = "#fff";
    ctx.font = "700 20px system-ui";
    ctx.fillText("Click to start", W / 2, H * .88);
  }
  function drawBossDefeated() {
    if (performance.now() > bossDefeatUntil) return;
    const w = 430, h = 68, x = W / 2 - w / 2, y = 54;
    ctx.fillStyle = "rgba(10,12,18,.9)";
    roundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.lineWidth = 1;
    roundRect(x, y, w, h, 12);
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "700 20px system-ui";
    ctx.fillText("BOSS DEFEATED", W / 2, y + 26);
    ctx.fillStyle = "rgba(255,255,255,.78)";
    ctx.font = "13px system-ui";
    ctx.fillText("Keep going and see how long you can survive!", W / 2, y + 49);
  }
  function drawDeath() {
    ctx.fillStyle = "rgba(10,12,18,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "700 38px system-ui";
    ctx.fillText(`YOU SURVIVED ${fmtTime(gameTime)}`, W / 2, H * .42);
    ctx.font = "16px system-ui";
    ctx.fillText(`Level ${player.level} · ${killCount} Kills`, W / 2, H * .42 + 34);
    ctx.fillText("Press R to restart", W / 2, H * .42 + 66);
  }
  function drawRestartConfirm() {
    if (dead || performance.now() > restartConfirmUntil) return;
    const w = 210, h = 34, x = W / 2 - w / 2, y = H - 54;
    ctx.fillStyle = "rgba(10,12,18,.88)";
    roundRect(x, y, w, h, 10);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.lineWidth = 1;
    roundRect(x, y, w, h, 10);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "700 14px system-ui";
    ctx.fillText("Press R again to restart", W / 2, y + 22);
  }
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, VW, VH);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();
    ctx.save();
    ctx.translate(shakeX, shakeY);
    drawGround();
    trails.forEach(drawTrail);
    gusts.forEach(drawGust);
    pickups.forEach(drawPickup);

    const worldObjects = [ ...visibles.map(o => ({
      kind: "prop",
      o,
      depth: o.x + o.y
    })), ...enemies.map(e => ({
      kind: "e",
      o: e,
      depth: e.x + e.y
    })), {
      kind: "p",
      o: player,
      depth: player.x + player.y
    } ].sort((a, b) => a.depth - b.depth);
    worldObjects.forEach(a => a.kind === "prop" ? drawProp(a.o) : a.kind === "p" ? drawUnicorn() : a.o.type === "boss" ? drawBossUnicorn(a.o) : drawEnemy(a.o));
    projectiles.forEach(drawProjectile);
    bursts.forEach(drawBurst);
    floaters.forEach(drawFloater);

    drawUI();
    ctx.restore();

  let last = performance.now();
  function frame(now) {
    let dt = Math.min(.033, (now - last) / 1e3);
    last = now;

    updateConfetti(dt);
    updateMenuAnim();
    if (hitStop > 0) {
      const use = Math.min(hitStop, dt);
      hitStop -= use;
      dt -= use;

    if (dt > 0) update(dt);

    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);
})();
